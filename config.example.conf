# ollamaskope - einfache Konfiguration, Zeile für Zeile
#
# Diese Datei ist freiwillig. Liegt sie als ollamaskope.conf (oder
# ollamaskope.env) neben config.json, hat sie Vorrang: ihre Werte überschreiben
# bind, port und timeout, ihre Endpunkte stehen vorn. Endpunkte aus config.json
# kommen hinzu, solange ihre URL hier nicht steht.
#
# Alles ab # ist Kommentar, Leerzeilen zählen nicht.
# Unbekannte Schlüssel sind ein Fehler mit Zeilennummer.
#
# Prüfen ohne Start:  python3 ollamaskope.py --pruefen

# Adresse und Port. 0.0.0.0 heißt: aus dem ganzen LAN erreichbar, ohne Anmeldung!
bind = 127.0.0.1
port = 8090
timeout = 25

# Feature, nicht Normalbetrieb: Ausrollen aus einer GGUF-Datei.
# Standard ist nein. Mit ja baut das Werkzeug auf dem Ziel aus einer GGUF,
# die DORT liegt - kopiert wird nichts.
# gguf = nein

# Endpunkt:  name | url | rechte
# rechte:    schreiben  oder  lesen   (ohne Angabe: lesen)
endpunkt = ollama-1 | http://10.0.0.24:11434 | schreiben
endpunkt = ollama-2 | http://10.0.0.81:11434 | lesen
endpunkt = ollama-3 | http://10.0.0.79:11434 | lesen

# Ohne Namen geht es auch - der Name kommt dann aus der Adresse:
# endpunkt = http://10.0.0.50:11434
